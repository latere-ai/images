name: Release

# Tag-triggered release via the central reusable pipeline (latere-ai/ci).
# Pushing a vX.Y.Z tag builds and pushes every cataloged image in
# dependency order, publishes the digest-pinned catalog.json to object
# storage, smokes the published images with test.sh, and publishes the
# GitHub release with notes + smoke evidence.
#
# Branch CI (lint, tooling tests, changed-image smoke builds) lives in
# ci.yml. Pinned at the central pipeline's @v1 moving major tag.

on:
  push:
    tags: ['v*']

# The reusable pipeline pushes images and creates the release. A reusable
# workflow cannot exceed the caller's token permissions, and this org
# defaults to read-only.
permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/images-release.yml@v1
    with:
      title: Sandbox Images
    secrets: inherit
